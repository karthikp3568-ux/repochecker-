# Production-like local services. In dev without Docker, use `pnpm services` instead (see DECISIONS.md).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: repojudge
      POSTGRES_PASSWORD: repojudge
      POSTGRES_DB: repojudge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  sandbox:
    build: ./sandbox
    image: repojudge-sandbox:latest
    profiles: [sandbox]
volumes:
  pgdata:
